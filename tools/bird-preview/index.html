<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carrion Buzzard — DUST & DEAD concept</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.35), transparent 18%, transparent 82%, rgba(0,0,0,.4));
    }
    #hud.hidden { display: none; }
    .chip {
      position: absolute; color: #d7fff0; font-weight: 700; letter-spacing: .08em;
      text-shadow: 0 1px 2px #000; border: 1px solid rgba(80,255,200,.25); border-radius: 10px;
      background: rgba(8,16,22,.72); padding: .35rem .6rem;
    }
    #round { top: 12px; left: 12px; font-size: 13px; }
    #round b { color: #ff4d4d; font-size: 22px; margin-left: .35rem; }
    #gun { bottom: 14px; right: 14px; font-size: 12px; text-align: right; }
    #gun em { font-style: normal; color: #fff; font-size: 20px; }
    #cross {
      position: absolute; left: 50%; top: 48%; width: 14px; height: 14px;
      margin: -7px 0 0 -7px; border: 2px solid rgba(255,255,255,.85);
      border-radius: 50%; box-shadow: 0 0 0 1px #0008;
    }
    #cross::after { content: ""; position: absolute; left: 4px; top: 4px; right: 4px; bottom: 4px; border: 1px solid #fff; border-radius: 50%; }
    #stats {
      position: fixed; left: 10px; bottom: 10px; color: #c9d4c4; font: 11px/1.4 ui-monospace, monospace;
      text-shadow: 0 1px 2px #000; pointer-events: none; opacity: .85;
    }
    #title {
      position: fixed; top: 12px; right: 12px; color: #e8dcc8; font-size: 11px; letter-spacing: .14em;
      text-transform: uppercase; text-shadow: 0 1px 2px #000; pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../../node_modules/three/build/three.module.js",
      "three/addons/": "../../node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="title">DUST &amp; DEAD  ·  Carrion Buzzard concept</div>
  <div id="hud" class="hidden">
    <div class="chip" id="round">ROUND <b>6</b></div>
    <div id="cross"></div>
    <div class="chip" id="gun">DUSTDEVIL .45<br><em>12</em> / 60</div>
  </div>
  <div id="stats"></div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
